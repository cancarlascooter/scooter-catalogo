name: Respaldo diario cifrado
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: backup-production
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'cancarlascooter/scooter-catalogo' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: 8cc19b5e40e03bd85efdd5cee6cd9dc7
      D1_DATABASE_ID: 9bc68e86-39c4-4998-bf6f-f63d0a3cc379
      R2_BUCKET: catalogo-pedidos-media
    steps:
      - name: Preparar carpetas temporales
        run: |
          echo "BACKUP_WORKDIR=$RUNNER_TEMP/scooter-backup-source" >> "$GITHUB_ENV"
          echo "BACKUP_OUTPUT_DIR=$RUNNER_TEMP/scooter-backup-encrypted" >> "$GITHUB_ENV"
      - name: Verificar repositorio privado
        env:
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: test "$PRIVATE_REPO" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/pip" install -r scripts/backup/requirements.txt
      - name: Exportar y verificar datos y archivos
        env:
          CLOUDFLARE_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: '"$RUNNER_TEMP/backup-venv/bin/python" scripts/backup/export.py'
      - name: Cifrar y comprobar descifrado
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/backup/encrypt.sh
      - name: Guardar copia privada por 30 días
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scooter-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scooter-backup-encrypted/backup.tar.gz.gpg
            ${{ runner.temp }}/scooter-backup-encrypted/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Limpiar archivos temporales
        if: always()
        run: rm -rf -- "$BACKUP_WORKDIR" "$BACKUP_OUTPUT_DIR"
